services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: reelvault-plex
    network_mode: host
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-America/New_York}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - PLEX_TRANSCODE_DIR=/transcode
    volumes:
      - ./plex-config:/config
      - /dev/shm:/transcode
      - ./media/safe:/data/safe
      - ./media/vault-18:/data/vault-18
    restart: unless-stopped

  reelvault-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reelvault-bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8787
      - REELVAULT_API_KEY=${REELVAULT_API_KEY}
      - RESIDENTIAL_PROXY_URL=${RESIDENTIAL_PROXY_URL:-}
      - PLEX_URL=http://host.docker.internal:32400
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - VPS_IP=${VPS_IP:-}
      - PLEX_DOMAIN=${PLEX_DOMAIN:-}
      - PLEX_PREFS_PATH=/plex-config/Library/Application Support/Plex Media Server/Preferences.xml
      - PLEX_TRANSCODE_DIR=/transcode
      - MEDIA_SAFE_DIR=/data/safe
      - MEDIA_NSFW_DIR=/data/vault-18
    volumes:
      - ./media/safe:/data/safe
      - ./media/vault-18:/data/vault-18
      - ./plex-config:/plex-config:ro
    depends_on:
      - plex
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: reelvault-caddy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - BRIDGE_DOMAIN=${BRIDGE_DOMAIN}
      - PLEX_DOMAIN=${PLEX_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - reelvault-bridge
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
